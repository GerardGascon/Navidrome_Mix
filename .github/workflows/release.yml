name: Build Release Images

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

env:
  ENDPOINT: ghcr.io/gerardgascon/daily-mixer

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.version.outputs.version}}
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.ENDPOINT }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    needs: [ version, build ]
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Manifests
        run: |
          docker buildx imagetools create \
            -t ${{ env.ENDPOINT }}:${{ needs.version.outputs.version }} \
            -t ${{ env.ENDPOINT }}:latest \
            ${{ env.ENDPOINT }}:${{ needs.version.outputs.version }}-amd64 \
            ${{ env.ENDPOINT }}:${{ needs.version.outputs.version }}-arm64

  release:
    needs: [ version, build, merge ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            docker-compose.yaml