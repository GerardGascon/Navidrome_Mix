services:
  navidrome_mix:
    build: .
    env_file:
      - .env
    environment:
      - NAVIDROME_URL=${NAVIDROME_URL}
      - NAVIDROME_USER=${NAVIDROME_USER}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD}
      - PLAYLIST_SIZE=50
      - MAX_PER_ARTIST=2
      - MAX_PER_ALBUM=1
      - AVOID_GENERATED_DAYS=30
      - POOL_SIZE=3000
      - KEEP_PLAYLIST_DAYS=30
    volumes:
      - ./data:/data
    restart: unless-stopped