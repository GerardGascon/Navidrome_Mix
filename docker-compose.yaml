services:
  navidrome_mix:
#    image: ghcr.io/gerardgascon/daily-mixer:latest
    build: .
    env_file:
      - .env
    environment:
      - SERVER_URL=${SERVER_URL}
      - SERVER_USERNAME=${SERVER_USERNAME}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - PLAYLIST_SIZE=50
      - MAX_PER_ARTIST=2
      - MAX_PER_ALBUM=1
      - SONG_MIN_LENGTH=60
      - AVOID_GENERATED_DAYS=30
      - POOL_SIZE=3000
    volumes:
      - ./data:/data
    restart: unless-stopped